<body><div class="wrap">

<header class="top">
  <div><div id="brandslot"></div><h1>Your order</h1><p class="sub">Avengers: Doomsday (2026), December 19, 2026 at 1:00 PM, A. Bichara Silverscreens, Cinema 4</p></div>
  <a class="btn alt sm" id="newBtn" href="index.html" hidden>Buy more tickets</a>
</header>
<ol class="steps" id="steps" aria-label="Progress"></ol>
<div id="view"><div class="sk" role="status"><span class="sr-only">Loading your order…</span><i></i><i></i><i></i></div></div>

</div>
<script>
const token = new URLSearchParams(location.search).get('o') || '';
const view = $('view');
$('brandslot').outerHTML = BRAND_HTML;
let O = null, holdEnd = 0, holdTimer = null, pollTimer = null, uploaded = null;
const imgs = {};

/* ---------- loading ---------- */
function fail(t) {
  renderSteps($('steps'), 2);
  view.innerHTML = `<div class="card">${msgIcon('link', 'bad')}<h2>We can't open this order</h2><p>${esc(t)}</p><p><a class="btn cta" href="index.html">Start a new order</a></p></div>`;
}
const HOLD_MIN = 40;                         // minutes a buyer has to pay and send the proof (set by hold-40-upgrade.sql)
const MSG_URL = 'https://m.me/dwclbatch2002';
const EXP_TITLE = 'This order has expired, no payment proof was submitted.';
const GONE_TITLE = 'This order is no longer available.';
const GONE_TEXT = 'It was either <b>deleted</b> by our team or it <b>expired</b> (no payment proof within ' + HOLD_MIN + ' minutes) and was removed. This link no longer works and no tickets are reserved under it. To buy tickets, please place a new order.';
const EXP_TEXT = 'Your tickets were <b>not</b> reserved. Orders with no payment proof submitted within ' + HOLD_MIN + ' minutes expire and are removed. Please place a new order to get your tickets.';
function gone() {                            // the order was cleared for good (it expired and was removed after a few days): nothing to bring back
  clearInterval(holdTimer); clearInterval(pollTimer);
  renderSteps($('steps'), 1);
  view.innerHTML = `<div class="card">${msgIcon('hourglass', 'mut')}<h2>${GONE_TITLE}</h2><p>${GONE_TEXT}</p>
    <p><a class="btn cta" href="index.html">Place a new order</a></p>
    <div class="note" style="margin-top:14px"><p style="margin:0">Already sent a payment for this order (GCash or bank transfer)? Please message us directly with your receipt so we can help you, or request a refund.</p>
    <p style="margin:12px 0 0"><a class="btn alt" href="${MSG_URL}" target="_blank" rel="noopener">Message us on Messenger</a></p></div></div>`;
}
function revokedView() {                     // approved earlier, then paused by the organizers: the proof exists, so never show "no payment proof"
  clearInterval(holdTimer);
  renderSteps($('steps'), 1);
  view.innerHTML = `<div class="card"><div class="seated rjb" id="rvBn" role="alert"><span class="sck" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v7M12 17.5v.5"/></svg></span><span><b>This order has been revoked, so its tickets are not valid right now.</b></span></div>
    <p style="margin:14px 0 0">Our team had to pause this order. If you think this is a mistake, or you have already paid, please message us right away and quote your order code <b>${esc(O.code)}</b>. We will review it with you.</p>
    <p style="margin:14px 0 0"><a class="btn" href="${MSG_URL}" target="_blank" rel="noopener">Message us on Messenger</a></p></div>`;
}
function expiredView() {                     // unpaid and the hold time is over: the order is about to be removed, nothing to bring back
  clearInterval(holdTimer); clearInterval(pollTimer);
  renderSteps($('steps'), 1);
  view.innerHTML = `<div class="card">${msgIcon('hourglass', 'warn')}<h2>${EXP_TITLE}</h2><p>${EXP_TEXT}</p>
    <p><a class="btn cta" href="index.html">Place a new order</a></p>
    <div class="note" style="margin-top:14px"><p style="margin:0">Already sent a payment for this order (GCash or bank transfer)? Please message us directly with your receipt so we can help you, or request a refund.</p>
    <p style="margin:12px 0 0"><a class="btn alt" href="${MSG_URL}" target="_blank" rel="noopener">Message us on Messenger</a></p></div></div>`;
}
const seatSig = d => (d.tickets || []).map(t => t.ref + ':' + (t.seat || '') + (t.waived ? 'w' : '')).join(',');
let justApproved = false, justRejected = false, justCancelled = false;
/* sound when the page updates itself after the organizer decides (browsers allow it once the guest has tapped the page, which they have by uploading) */
let ac = null;
/* Two ways to make the sound, so one of them works even if the browser has put the other to sleep (phones do this when the page was in the background or after the file picker):
   1) Web Audio (instant), 2) a small pre-rendered audio clip that was "primed" on the guest's first tap. */
const SR = 22050;
function mkWav(list, type, vol) {
  const dur = Math.max(...list.map(([f, t, d]) => t + d)) + 0.1, n = Math.ceil(dur * SR), s = new Float32Array(n);
  list.forEach(([f, t, d]) => {
    const st = Math.floor(t * SR), len = Math.floor((d + 0.02) * SR);
    for (let i = 0; i < len && st + i < n; i++) {
      const x = i / SR, ph = 2 * Math.PI * f * x;
      const w = type === 'square' ? (Math.sin(ph) >= 0 ? 1 : -1) : type === 'triangle' ? (2 / Math.PI) * Math.asin(Math.sin(ph)) : Math.sin(ph);
      s[st + i] += w * (x < 0.02 ? x / 0.02 : Math.exp(-5 * (x - 0.02) / d)) * (vol || 0.32);
    }
  });
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), W = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  W(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); W(8, 'WAVE'); W(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); W(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s[i])) * 32767, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const SEATED = [[659, 0, 0.12], [880, 0.11, 0.12], [1319, 0.22, 0.55], [1760, 0.34, 0.4]];      // bright 'ticket confirmed' ding, different from the approval notes
const SOFT = [[587, 0, 0.16], [440, 0.15, 0.4]];      // gentle two-note 'heads up', much softer than the rejection buzz
const APPROVED = [[523, 0, 0.14], [659, 0.1, 0.14], [784, 0.2, 0.14], [1047, 0.3, 0.5]], REJECTED = [[466, 0, 0.2], [349, 0.24, 0.2], [233, 0.48, 0.55]];
let clips = null;
function makeClips() { if (clips) return; try { clips = { ok: new Audio(mkWav(APPROVED, 'triangle', 0.32)), no: new Audio(mkWav(REJECTED, 'square', 0.22)), seat: new Audio(mkWav(SEATED, 'sine', 0.3)), soft: new Audio(mkWav(SOFT, 'sine', 0.2)) }; Object.values(clips).forEach(a => { a.preload = 'auto'; }); } catch (_) { clips = {}; } }
function primeClips() { makeClips(); Object.values(clips).forEach(a => { try { a.muted = true; const p = a.play(); (p && p.then ? p : Promise.resolve()).then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); } catch (_) {} }); }
function unlockAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state !== 'running') ac.resume(); } catch (_) {} }

  ${namesCard()}
  ${bad.length ? `<div class="err"><b>${bad.length === 1 ? 'One ticket is' : bad.length + ' tickets are'} not valid right now:</b> ${bad.map(t => esc(t.ref)).join(', ')}. Please contact the organizer and give your order code <b>${esc(O.code)}</b>.</div>` : ''}
  <div class="tickets" id="tickets">${O.tickets.map(t => !ok(t) ? `<figure class="tk" data-ref="${esc(t.ref)}"><div class="ph" style="aspect-ratio:auto;height:140px;text-align:center">${esc(t.ref)}<br>Not valid right now</div></figure>`
      : !unlocked(t) ? `<figure class="tk lock" data-ref="${esc(t.ref)}"><div class="lk"><div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${MICO.lock}</svg></div><b class="rf">${esc(t.ref)}</b><span class="mut">${esc(t.holder)}</span>Reserve your seat to unlock this ticket.</div></figure>`
      : `<figure class="tk" data-ref="${esc(t.ref)}">
      <div class="ph">Preparing ticket\u2026</div>
      <figcaption><button class="btn sm" data-dl="${esc(t.ref)}" type="button">Download</button>
      <button class="btn alt sm" data-cp="${esc(t.ref)}" type="button">Copy number</button></figcaption></figure>`).join('')}</div>
  ${ready.length > 1 ? `<p style="text-align:center"><button class="btn alt" id="dlAll" type="button">Download all tickets</button></p>` : ''}`;

  view.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.cp) copyText(b.dataset.cp).then(() => flash(b, 'Copied'));
    if (b.dataset.dl) download(b.dataset.dl);
    if (b.dataset.rn) editName(b.dataset.rn);
  };
  const all = $('dlAll');
  if (all) all.onclick = async () => { for (const t of ready) { download(t.ref); await new Promise(ok => setTimeout(ok, 500)); } };
  (async () => {
    for (const t of ready) {
      const r = t.ref;
      const fig = document.querySelector(`.tk[data-ref="${CSS.escape(r)}"]`);
      try {
        imgs[r] = await drawTicketImage(r, t.holder, O.code, t.category, t.seat, t.seat_group, t.waived && !t.seat);
        if (!fig) continue;
        const im = new Image(); im.src = imgs[r]; im.alt = `Ticket ${r} for ${t.holder}, ${EVENT.title}, ${EVENT.date} at ${EVENT.time}`;
        fig.replaceChild(im, fig.querySelector('.ph'));
      } catch (err) {
        const ph = fig && fig.querySelector('.ph');
        if (ph) ph.innerHTML = `Could not draw ticket ${esc(r)}.<br><small>${esc(err && err.message || err)}</small><br><small>Reload the page (Ctrl+F5). If it keeps happening, make sure common.js is the latest uploaded version.</small>`;
      }
    }
  })();
}
/* ---------- the names printed on the tickets: the buyer may change each one once ---------- */
const capName = v => v.replace(/(^|[\s-])([a-zà-ÿ])/g, (m, p, c) => p + c.toUpperCase());
function namesCard() {
  const ts = O.tickets || [];
  if (!ts.length || !ts.every(t => 'name_edited' in t)) return '';                  // hidden until name-edit-upgrade.sql has been run
  return `<section class="card" id="namesCard"><h2>Names on your tickets <span class="mgr">(Moviegoer)</span></h2>
    <p class="mut small" style="margin-top:0">Each ticket is printed with the name of the <b>moviegoer</b>, the person who will watch the movie. If a ticket is for someone else, you can change its name <b>once</b>. After that, only the organizer can change it.</p>
    <ul class="nmlist">${ts.map(t => `<li><span class="nmr"><b>${esc(t.ref)}</b><span class="nmn">${esc(t.holder)}</span></span>${t.checked_in ? '<span class="mut small">Checked in</span>' : t.name_edited ? '<span class="mut small">Name changed</span>' : `<button class="btn alt sm" data-rn="${esc(t.ref)}" type="button">Edit name</button>`}</li>`).join('')}</ul></section>`;
}
async function editName(ref) {
  const t = (O.tickets || []).find(x => x.ref === ref); if (!t) return;
  const raw = await ui.prompt(`New name for ticket ${ref}. This is the name printed on the ticket, so enter it exactly as it should appear.`, { title: 'Change ticket name', value: t.holder, ok: 'Next', maxlength: 80 });
  if (raw === null) return;
  const fresh = capName(raw.replace(/\s+/g, ' ').trim());
  if (fresh.length < 2) return ui.alert('Please enter the full name, at least 2 letters.', { title: 'Name too short' });
  if (fresh === t.holder) return;
  if (!await ui.confirm(`Change the name on ticket ${ref} from "${t.holder}" to "${fresh}"?\n\nYou can only do this once for this ticket. After that, only the organizer can change it.`, { title: 'Confirm name change', ok: 'Change name', cancel: 'Go back' })) return;
  const { error } = await sb.rpc('rename_my_ticket', { p_token: token, p_ref: ref, p_name: fresh });
  if (error) {
    await ui.alert(/does not exist|schema cache|Could not find/i.test(error.message) ? 'Changing names is not available right now. Please message us on Messenger.' : error.message, { title: 'Could not change the name' });
    return load(true);
  }
  delete imgs[ref];                                                                  // draw the ticket again with the new name
  await load(true);
  const el = document.getElementById('namesCard'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function download(ref) {
  if (!imgs[ref]) return;
  const a = document.createElement('a'); a.href = imgs[ref]; a.download = `ticket-${ref}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}

load(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden && O && O.status !== 'cancelled') load(false); });
</script></body></html>
